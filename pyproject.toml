[project]
name = "resumeagent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aisuite>=0.2.0",
    "dotenv>=0.9.9",
    "gradio>=6.31.0",
    "openai>=3.40.0",
    "pypdf>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/resume_agent",
]
